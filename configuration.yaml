          {% set p_max = states('input_number.pv1_record_w') | float(0) %}
          {% if p_max > 50 %}
            {% set pct = min(100.0, ((p_max / 4545) * 100)) | round(1) %}
            {% set kw = (p_max / 1000) | round(2) %}
            {% set t_ini = states('input_datetime.pv1_racha_inicio') %}
            {% set t_fin = states('input_datetime.pv1_racha_fin') %}
            {% set s_ini = state_attr('input_datetime.pv1_racha_inicio', 'timestamp') | int(0) %}
            {% set s_fin = state_attr('input_datetime.pv1_racha_fin', 'timestamp') | int(0) %}
            {% set dur_s = max(0, (s_fin - s_ini)) %}
            {% set m = dur_s // 60 %}
            {% set s = dur_s % 60 %}
            {% if dur_s >= 60 %}
              {{ pct }}% ({{ kw }} kW · {{ t_ini }} - {{ t_fin }} · {{ m }}m {{ s }}s)
            {% else %}
              {{ pct }}% ({{ kw }} kW · {{ t_ini }} - {{ t_fin }} · {{ s }}s)
