      # --- DISPLAY ACUMULADO DIARIO VS PREVISIÓN ---
      - name: "Solar Generacion vs Prevision Hoy Display"
        unique_id: solar_generacion_vs_prevision_hoy_display
        icon: mdi:solar-power
        state: >
          {% set gen = states('sensor.solar_energia_fv_diaria') | float(0) | round(2) %}
          {% set prev = states('sensor.solar_prevision_energia_total_hoy_kwh') | float(0) | round(2) %}
          {% if prev > 0 %}
            {% set pct = ((gen / prev) * 100) | round(1) %}
            {{ gen }} / {{ prev }} kWh ({{ pct }}%)
          {% else %}
            {{ gen }} kWh
          {% endif %}

      # --- DISPLAY ACUMULADO MENSUAL VS PREVISIÓN ACUMULADA ---
      - name: "Solar Generacion vs Prevision Mes Display"
        unique_id: solar_generacion_vs_prevision_mes_display
        icon: mdi:calendar-month
        state: >
          {% set gen_mes = states('sensor.solar_energia_fv_mensual') | float(0) | round(2) %}
          {% set prev_cerrada_mes = states('sensor.solar_prevision_mensual_acumulada') | float(0) %}
          {% set prev_hoy = states('sensor.solar_prevision_energia_total_hoy_kwh') | float(0) %}
          {% set prev_mes_total = (prev_cerrada_mes + prev_hoy) | round(2) %}

          {% if prev_mes_total > 0 %}
            {% set pct = ((gen_mes / prev_mes_total) * 100) | round(1) %}
