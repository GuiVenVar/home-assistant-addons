# =============================================================
# CONFIGURACIÓN PRINCIPAL DE HOME ASSISTANT
# =============================================================
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# =============================================================
# HELPERS (INPUT NUMBER & DATETIME): DIARIOS E HISTÓRICOS
# =============================================================
input_number:
  # --- Control Económico Gasolina ---
  precio_gasolina_litro:
    name: "Precio Gasolina (€/L)"
    min: 1.00
    max: 3.00
    step: 0.01
    initial: 1.52
    mode: box

  # --- Picos Diarios ---
  pv1_record_w:
    name: "PV1 Record W"
    min: 0
    max: 6000
    step: 1
    mode: box
  pv2_record_w:
    name: "PV2 Record W"
    min: 0
    max: 10000
    step: 1
    mode: box
  total_record_w:
    name: "Total Record W"
    min: 0
    max: 15000
    step: 1
    mode: box
  consumo_record_w:
    name: "Consumo Record W"
    min: 0
    max: 15000
    step: 1
    mode: box

  # --- Récords Históricos Absolutos ---
  pv1_record_historico_w:
    name: "PV1 Record Historico W"
    min: 0
    max: 6000
    step: 1
    mode: box
  pv2_record_historico_w:
    name: "PV2 Record Historico W"
    min: 0
    max: 10000
    step: 1
    mode: box
  total_record_historico_w:
    name: "Total Record Historico W"
    min: 0
    max: 15000
    step: 1
    mode: box
  consumo_record_historico_w:
    name: "Consumo Record Historico W"
    min: 0
    max: 15000
    step: 1
    mode: box

  # --- Contador Vitalicio de Previsiones (Para Utility Meter) ---
  solar_prevision_contador_vitalicio_kwh:
    name: "Solar Previsión Contador Vitalicio kWh"
    min: 0
    max: 500000
    step: 0.01
    mode: box

input_datetime:
  # --- Rachas Diarias (Solo Hora) ---
  pv1_racha_inicio:
    name: "PV1 Racha Inicio"
    has_date: false
    has_time: true
  pv1_racha_fin:
    name: "PV1 Racha Fin"
    has_date: false
    has_time: true

  pv2_racha_inicio:
    name: "PV2 Racha Inicio"
    has_date: false
    has_time: true
  pv2_racha_fin:
    name: "PV2 Racha Fin"
    has_date: false
    has_time: true

  total_racha_inicio:
    name: "Total Racha Inicio"
    has_date: false
    has_time: true
  total_racha_fin:
    name: "Total Racha Fin"
    has_date: false
    has_time: true

  consumo_racha_inicio:
    name: "Consumo Racha Inicio"
    has_date: false
    has_time: true
  consumo_racha_fin:
    name: "Consumo Racha Fin"
    has_date: false
    has_time: true

  # --- Timestamps Récord Histórico (Fecha + Hora) ---
  pv1_record_historico_ts:
    name: "PV1 Record Historico TS"
    has_date: true
    has_time: true
  pv2_record_historico_ts:
    name: "PV2 Record Historico TS"
    has_date: true
    has_time: true
  total_record_historico_ts:
    name: "Total Record Historico TS"
    has_date: true
    has_time: true
  consumo_record_historico_ts:
    name: "Consumo Record Historico TS"
    has_date: true
    has_time: true

# =============================================================
# 1. RECEPCIÓN DE TELEMETRÍA MQTT (MASTERPOWER / AXPERT)
# =============================================================
mqtt:
  sensor:
    # --- MPPT 1 (String 1 / PV1 Sur) ---
    - name: "Solar MPPT1 Voltaje"
      unique_id: "solar_mppt1_voltaje"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.PvInputVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      icon: "mdi:solar-panel"

    - name: "Solar MPPT1 Corriente"
      unique_id: "solar_mppt1_corriente"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.PvInputCurrent | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      icon: "mdi:current-dc"

    - name: "Solar MPPT1 Potencia"
      unique_id: "solar_mppt1_potencia"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.PvInputPower | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: "mdi:solar-power"

    # --- MPPT 2 (String 2 / PV2 Techo) ---
    - name: "Solar MPPT2 Voltaje"
      unique_id: "solar_mppt2_voltaje"
      state_topic: "power/axpert96342210104295_pv2"
      value_template: "{{ value_json.Pv2InputVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      icon: "mdi:solar-panel"

    - name: "Solar MPPT2 Corriente"
      unique_id: "solar_mppt2_corriente"
      state_topic: "power/axpert96342210104295_pv2"
      value_template: "{{ value_json.Pv2InputCurrent | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      icon: "mdi:current-dc"

    - name: "Solar MPPT2 Potencia"
      unique_id: "solar_mppt2_potencia"
      state_topic: "power/axpert96342210104295_pv2"
      value_template: "{{ value_json.Pv2InputPower | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: "mdi:solar-power"

    # --- BANCO DE BATERÍAS (4x Upower UE-48Li5120I = 20.48 kWh) ---
    - name: "Batería Capacidad SOC"
      unique_id: "bateria_capacidad_soc"
      state_topic: "power/axpert"
      value_template: "{{ value_json.BatteryCapacity | int(0) }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    - name: "Batería Voltaje"
      unique_id: "bateria_voltaje"
      state_topic: "power/axpert"
      value_template: "{{ value_json.BatteryVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "Batería Voltaje SCC"
      unique_id: "bateria_voltaje_scc"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.BatteryVoltageFromScc | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "Batería Corriente Carga"
      unique_id: "bateria_corriente_carga"
      state_topic: "power/axpert"
      value_template: "{{ value_json.BatteryChargingCurrent | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      icon: "mdi:battery-arrow-up"

    - name: "Batería Corriente Descarga"
      unique_id: "bateria_corriente_descarga"
      state_topic: "power/axpert"
      value_template: "{{ value_json.BatteryDischargeCurrent | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      icon: "mdi:battery-arrow-down"

    # --- INVERSOR Y RED AC (GRID / GENERADOR) ---
    - name: "Grid Voltaje"
      unique_id: "grid_voltaje"
      state_topic: "power/axpert"
      value_template: "{{ value_json.GridVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      icon: "mdi:transmission-tower"

    - name: "Grid Frecuencia"
      unique_id: "grid_frecuencia"
      state_topic: "power/axpert"
      value_template: "{{ value_json.GridFrequency | float(0) }}"
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      icon: "mdi:sine-wave"

    - name: "Inversor Potencia Activa Salida"
      unique_id: "inversor_potencia_activa_salida"
      state_topic: "power/axpert"
      value_template: "{{ value_json.OutputActivePower | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: "mdi:flash"

    - name: "Inversor Potencia Aparente Salida"
      unique_id: "inversor_potencia_aparente_salida"
      state_topic: "power/axpert"
      value_template: "{{ value_json.OutputAparentPower | float(0) }}"
      unit_of_measurement: "VA"
      device_class: apparent_power
      state_class: measurement

    - name: "Inversor Porcentaje Carga"
      unique_id: "inversor_porcentaje_carga"
      state_topic: "power/axpert"
      value_template: "{{ value_json.LoadPercentage | float(0) }}"
      unit_of_measurement: "%"
      state_class: measurement
      icon: "mdi:gauge"

    - name: "Inversor Voltaje Salida"
      unique_id: "inversor_voltaje_salida"
      state_topic: "power/axpert"
      value_template: "{{ value_json.OutputVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "Inversor Temperatura Disipador"
      unique_id: "inversor_temperatura_disipador"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.InverterHeatsinkTemperature | float(0) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Inversor Bus Voltaje"
      unique_id: "inversor_bus_voltaje"
      state_topic: "power/axpert96342210104295"
      value_template: "{{ value_json.BusVoltage | float(0) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

# =============================================================
# 2. FILTROS, INTEGRACIONES Y ESTADÍSTICAS
# =============================================================
sensor:
  - platform: filter
    name: "Consumo Vivienda Media 5m"
    entity_id: sensor.consumo_vivienda_w
    filters:
      - filter: time_simple_moving_average
        window_size: "00:05:00"
        precision: 1

  # Integraciones Riemann (W -> kWh)
  - platform: integration
    source: sensor.solar_potencia_total_fv
    name: "Solar Energía FV Acumulada Total"
    unique_id: "solar_energia_fv_acumulada_total_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.solar_mppt1_potencia
    name: "Solar MPPT1 Energía Acumulada"
    unique_id: "solar_mppt1_energia_acumulada_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.solar_mppt2_potencia
    name: "Solar MPPT2 Energía Acumulada"
    unique_id: "solar_mppt2_energia_acumulada_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.grid_potencia_activa_w
    name: "Grid Energía Acumulada Total"
    unique_id: "grid_energia_acumulada_total_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.inversor_potencia_activa_salida
    name: "Consumo Energía Acumulada Total"
    unique_id: "consumo_energia_acumulada_total_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.bateria_potencia_carga
    name: "Batería Energía Carga Acumulada"
    unique_id: "bateria_energia_carga_acumulada_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.bateria_potencia_descarga
    name: "Batería Energía Descarga Acumulada"
    unique_id: "bateria_energia_descarga_acumulada_kwh"
    unit_prefix: k
    round: 3
    method: trapezoidal

  # History Stats
  - platform: history_stats
    name: "Solar PV1 Tiempo Acumulado Record Hoy"
    unique_id: solar_pv1_tiempo_acumulado_record_hoy
    entity_id: binary_sensor.solar_pv1_en_zona_record
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Solar PV2 Tiempo Acumulado Record Hoy"
    unique_id: solar_pv2_tiempo_acumulado_record_hoy
    entity_id: binary_sensor.solar_pv2_en_zona_record
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Solar Total Tiempo Acumulado Record Hoy"
    unique_id: solar_total_tiempo_acumulado_record_hoy
    entity_id: binary_sensor.solar_total_en_zona_record
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Consumo Vivienda Tiempo Acumulado Record Hoy"
    unique_id: consumo_vivienda_tiempo_acumulado_record_hoy
    entity_id: binary_sensor.consumo_vivienda_en_zona_record
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

# =============================================================
# 3. TEMPLATES MODERNOS UNIFICADOS
# =============================================================
template:
  - binary_sensor:
      - name: "PV1 Sur en Zona Record"
        unique_id: solar_pv1_en_zona_record
        state: >
          {% set p = states('sensor.solar_mppt1_potencia') | float(0) %}
          {% set rec = states('input_number.pv1_record_w') | float(0) %}
          {{ rec > 100 and p >= (rec - 100) }}

      - name: "PV2 Techo en Zona Record"
        unique_id: solar_pv2_en_zona_record
        state: >
          {% set p = states('sensor.solar_mppt2_potencia') | float(0) %}
          {% set rec = states('input_number.pv2_record_w') | float(0) %}
          {{ rec > 100 and p >= (rec - 100) }}

      - name: "Campo Solar Total en Zona Record"
        unique_id: solar_total_en_zona_record
        state: >
          {% set p = states('sensor.solar_potencia_total_fv') | float(0) %}
          {% set rec = states('input_number.total_record_w') | float(0) %}
          {{ rec > 100 and p >= (rec - 100) }}

      - name: "Consumo Vivienda en Zona Record"
        unique_id: consumo_vivienda_en_zona_record
        state: >
          {% set p = states('sensor.consumo_vivienda_w') | float(0) %}
          {% set rec = states('input_number.consumo_record_w') | float(0) %}
          {{ rec > 100 and p >= (rec - 100) }}

  - sensor:
      # --- GRID / GENERADOR POTENCIA Y ELÉCTRICOS ---
      - name: "Grid Potencia Activa W"
        unique_id: "grid_potencia_activa_w"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: "mdi:transmission-tower"
        state: >
          {% set grid_v = states('sensor.grid_voltaje') | float(0) %}
          {% if grid_v > 50 %}
            {{ states('sensor.inversor_potencia_activa_salida') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Grid Potencia Activa kW"
        unique_id: "grid_potencia_activa_kw"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: "mdi:transmission-tower"
        state: >
          {{ (states('sensor.grid_potencia_activa_w') | float(0) / 1000) | round(3) }}

      - name: "Grid Coste kWh Actual"
        unique_id: "grid_coste_kwh_actual"
        unit_of_measurement: "€/kWh"
        state: >
          {% set grid_v = states('sensor.grid_voltaje') | float(0) %}
          {% if grid_v > 50 %}
            {% set precio_l = states('input_number.precio_gasolina_litro') | float(1.52) %}
            {{ (((3.5 / 4.5) * precio_l)) | round(3) }}
          {% else %}
            0.16
          {% endif %}

      # --- ENERGÍA DISPONIBLE (BASE 20.48 kWh) ---
      - name: "Bateria Energia Disponible"
        unique_id: bateria_energia_disponible_kwh
        unit_of_measurement: "kWh"
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-charging-100
        state: >
          {% set soc = states('sensor.bateria_capacidad_soc') | float(0) %}
          {{ ((soc / 100) * 20.48) | round(2) }}

      # --- BATERÍA DISPLAY UNIFICADO (SOC + kWh) ---
      - name: "Bateria Nivel y Energia Display"
        unique_id: bateria_nivel_y_energia_display
        icon: mdi:battery-charging
        state: >
          {% set soc = states('sensor.bateria_capacidad_soc') | int(0) %}
          {% set kwh = states('sensor.bateria_energia_disponible') | float(0) %}
          {{ soc }}% · {{ kwh }} kWh

      # --- TIEMPO RESTANTE PARA CARGA COMPLETA (CON kWh RESTANTES) ---
      - name: "Bateria Tiempo Carga Completa Display"
        unique_id: bateria_tiempo_carga_completa_display
        icon: mdi:battery-clock
        state: >
          {% set soc = states('sensor.bateria_capacidad_soc') | float(0) %}
          {% set p_carga = states('sensor.bateria_potencia_carga') | float(0) %}
          {% set kwh_faltantes = max(0, ((100 - soc) / 100) * 20.48) | round(2) %}

          {% if soc >= 99.5 %}
            0.00 kWh restantes · Completa
          {% elif p_carga > 50 %}
            {% set kw_carga = p_carga / 1000 %}
            {% set horas = kwh_faltantes / kw_carga %}
            {% set total_min = (horas * 60) | round(0) | int %}
            {% set h = total_min // 60 %}
            {% set m = total_min % 60 %}
            {% if h > 0 %}
              {{ kwh_faltantes }} kWh restantes · {{ h }}h {{ m }}m
            {% else %}
              {{ kwh_faltantes }} kWh restantes · {{ m }}m
            {% endif %}
          {% else %}
            {{ kwh_faltantes }} kWh restantes · ∞
          {% endif %}

      # --- AUTONOMÍA NUMÉRICA ---
      - name: "Bateria Autonomia Estimada"
        unique_id: bateria_autonomia_estimada_horas
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >
          {% set soc = states('sensor.bateria_capacidad_soc') | float(0) %}
          {% set p_descarga_raw = states('sensor.bateria_potencia_descarga') | float(0) %}
          {% set p_carga_raw = states('sensor.bateria_potencia_carga') | float(0) %}
          {% set energia_util_kwh = max(0, ((soc - 10) / 100) * 20.48) %}

          {% if soc <= 10 %}
            0.0
          {% elif p_carga_raw > 50 or p_descarga_raw < 20 %}
            99.0
          {% else %}
            {% set p_calc = states('sensor.consumo_vivienda_media_5m') | float(p_descarga_raw) %}
            {% set p_kw = max(p_descarga_raw, p_calc) / 1000 %}
            {{ (energia_util_kwh / p_kw) | round(1) }}
          {% endif %}

      # --- AUTONOMÍA DISPLAY ---
      - name: "Bateria Autonomia Display"
        unique_id: bateria_autonomia_display
        icon: "mdi:timer-sand"
        state: >
          {% set horas = states('sensor.bateria_autonomia_estimada') | float(0) %}
          {% if horas >= 99 %}
            ∞
          {% else %}
            {{ horas }} h
          {% endif %}

      # -------------------------------------------------------
      # GENERACIÓN SOLAR SUMADA (MPPT1 + MPPT2)
      # -------------------------------------------------------
      - name: "Solar Potencia Total FV"
        unique_id: "solar_potencia_total_fv_w"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: "mdi:solar-power-variant"
        state: >
          {% set p1 = states('sensor.solar_mppt1_potencia') | float(0) %}
          {% set p2 = states('sensor.solar_mppt2_potencia') | float(0) %}
          {{ (p1 + p2) | round(1) }}

      - name: "Solar Potencia Total FV kW"
        unique_id: "solar_potencia_total_fv_kw"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: "mdi:solar-power"
        state: >
          {{ (states('sensor.solar_potencia_total_fv') | float(0) / 1000) | round(3) }}

      - name: "Solar MPPT1 Potencia kW"
        unique_id: "solar_mppt1_potencia_kw"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.solar_mppt1_potencia') | float(0) / 1000) | round(3) }}

      - name: "Solar MPPT2 Potencia kW"
        unique_id: "solar_mppt2_potencia_kw"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.solar_mppt2_potencia') | float(0) / 1000) | round(3) }}

      - name: "Solar Total Corriente"
        unique_id: "solar_total_corriente"
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: "mdi:current-dc"
        state: >
          {% set c1 = states('sensor.solar_mppt1_corriente') | float(0) %}
          {% set c2 = states('sensor.solar_mppt2_corriente') | float(0) %}
          {{ (c1 + c2) | round(2) }}

      - name: "Solar Total Voltaje Medio"
        unique_id: "solar_total_voltaje_medio"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: "mdi:solar-panel"
        state: >
          {% set v1 = states('sensor.solar_mppt1_voltaje') | float(0) %}
          {% set v2 = states('sensor.solar_mppt2_voltaje') | float(0) %}
          {% if v1 > 0 and v2 > 0 %}
            {{ ((v1 + v2) / 2) | round(0) }}
          {% else %}
            {{ max(v1, v2) | round(0) }}
          {% endif %}

      - name: "Solar Rendimiento Total Pct"
        unique_id: "solar_rendimiento_total_pct"
        unit_of_measurement: "%"
        state_class: measurement
        icon: "mdi:gauge"
        state: >
          {% set p_total = states('sensor.solar_potencia_total_fv') | float(0) %}
          {{ min(100.0, ((p_total / 12120) * 100)) | round(1) }}

      - name: "Solar Rendimiento PV1 Sur Pct"
        unique_id: "solar_rendimiento_pv1_sur_pct"
        unit_of_measurement: "%"
        state_class: measurement
        icon: "mdi:solar-panel"
        state: >
          {% set p_pv1 = states('sensor.solar_mppt1_potencia') | float(0) %}
          {{ min(100.0, ((p_pv1 / 4545) * 100)) | round(1) }}

      - name: "Solar Rendimiento PV2 Techo Pct"
        unique_id: "solar_rendimiento_pv2_techo_pct"
        unit_of_measurement: "%"
        state_class: measurement
