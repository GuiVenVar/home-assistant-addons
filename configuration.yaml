          {% set i_discharge = states('sensor.bateria_corriente_descarga') | float(0) %}
          {% if i_charge > 0 %}
            {{ (v * i_charge) | round(1) }}
          {% elif i_discharge > 0 %}
            {{ (v * i_discharge * -1) | round(1) }}
          {% else %}
