        icon: "mdi:sine-wave"
        state: >
          {% set w = states('sensor.inversor_potencia_activa_salida') | float(0) %}
          {% set va = states('sensor.inversor_potencia_aparente_salida') | float(0) %}
          {% if va > 0 %}
            {{ min((w / va) | round(2), 1.0) }}
          {% else %}
            1.0
          {% endif %}

