        state: >
          {% set e_sur = states('sensor.energy_production_today') | float(0) %}
          {% set e_oeste = states('sensor.energy_production_today_2') | float(0) %}
          {% set e_este = states('sensor.energy_production_today_3') | float(0) %}
          {{ (e_sur + e_oeste + e_este) | round(2) }}

