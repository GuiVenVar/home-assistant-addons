          {% set precio_kwh = states('sensor.grid_coste_kwh_actual') | float(1.18) %}
          {{ (kwh_grid * precio_kwh) | round(2) }}

      - name: "Grid Gasto Coste Mes EUR"
        unique_id: "grid_gasto_coste_mes_eur"
        unit_of_measurement: "€"
        state_class: total
        icon: "mdi:cash-minus"
        state: >
          {% set kwh_grid_mes = states('sensor.grid_energia_mensual') | float(0) %}
          {% set precio_kwh = states('sensor.grid_coste_kwh_actual') | float(1.18) %}
          {{ (kwh_grid_mes * precio_kwh) | round(2) }}

      - name: "Grid Litros Gasolina Mes"
        unique_id: "grid_litros_gasolina_mes"
        unit_of_measurement: "L"
        state_class: total
        icon: "mdi:gas-station"
        state: >
          {% set kwh_grid_mes = states('sensor.grid_energia_mensual') | float(0) %}
          {{ (kwh_grid_mes * (3.5 / 4.5)) | round(1) }}

      - name: "Solar Ahorro Estimado Hoy"
        unique_id: "solar_ahorro_hoy_eur"
        unit_of_measurement: "€"
        state_class: total
        icon: "mdi:currency-eur"
        state: >
          {{ (states('sensor.consumo_energia_diario') | float(0) * 0.16) | round(2) }}

      - name: "Solar Ahorro Estimado Mes"
        unique_id: "solar_ahorro_mes_eur"
        unit_of_measurement: "€"
        state_class: total
        icon: "mdi:currency-eur"
        state: >
          {{ (states('sensor.consumo_energia_mensual') | float(0) * 0.16) | round(2) }}

      - name: "Consumo Coste Teórico Hoy"
        unique_id: "consumo_coste_hoy_eur"
        unit_of_measurement: "€"
        state_class: total
        icon: "mdi:cash-minus"
        state: >
          {% set kwh_solar = states('sensor.consumo_energia_diario') | float(0) %}
          {% set coste_grid_hoy = states('sensor.grid_gasto_coste_hoy_eur') | float(0) %}
          {{ ((kwh_solar * 0.16) + coste_grid_hoy) | round(2) }}

      - name: "Consumo Coste Teórico Mes"
        unique_id: "consumo_coste_mes_eur"
        unit_of_measurement: "€"
        state_class: total
        icon: "mdi:cash-minus"
        state: >
          {% set kwh_solar_mes = states('sensor.consumo_energia_mensual') | float(0) %}
          {% set coste_grid_mes = states('sensor.grid_gasto_coste_mes_eur') | float(0) %}
          {{ ((kwh_solar_mes * 0.16) + coste_grid_mes) | round(2) }}

